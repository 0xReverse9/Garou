version: '3.8'

# Docker Compose pour TEST LOCAL
# Lance tous les containers sur une seule machine pour tester

services:
  narrator:
    image: localhost:443/garou-narrator:latest
    container_name: garou-narrator
    hostname: narrator
    ports:
      - "5000:5000"
    environment:
      - NARRATOR_HOST=0.0.0.0
      - NARRATOR_PORT=5000
      - EXPECTED_PLAYERS=3
    networks:
      - garou-network

  player1:
    image: localhost:443/garou-player:latest
    container_name: garou-player1
    hostname: player1
    environment:
      - PLAYER_ID=player1
      - NARRATOR_HOST=narrator
      - NARRATOR_PORT=5000
    networks:
      - garou-network
    depends_on:
      - narrator

  player2:
    image: localhost:443/garou-player:latest
    container_name: garou-player2
    hostname: player2
    environment:
      - PLAYER_ID=player2
      - NARRATOR_HOST=narrator
      - NARRATOR_PORT=5000
    networks:
      - garou-network
    depends_on:
      - narrator

  player3:
    image: localhost:443/garou-player:latest
    container_name: garou-player3
    hostname: player3
    environment:
      - PLAYER_ID=player3
      - NARRATOR_HOST=narrator
      - NARRATOR_PORT=5000
    networks:
      - garou-network
    depends_on:
      - narrator

networks:
  garou-network:
    driver: bridge
