version: '3.8'

# Docker Compose pour VM2 (Proxmox)
# Contient les 3 joueurs clients
# VM2 IP: 172.16.2.1/24, Gateway: 172.16.2.254 (VM3)
# VM1 accessible via: 172.16.1.1 (routed through VM3)

services:
  player1:
    image: localhost:443/garou-player:latest
    container_name: garou-player1
    hostname: player1
    pull_policy: always
    environment:
      - PLAYER_ID=player1
      - NARRATOR_HOST=172.16.1.1  # VM1 IP via VM3 router
      - NARRATOR_PORT=5000
    networks:
      - garou-network
    restart: unless-stopped
    depends_on:
      - player2

  player2:
    image: localhost:443/garou-player:latest
    container_name: garou-player2
    hostname: player2
    pull_policy: always
    environment:
      - PLAYER_ID=player2
      - NARRATOR_HOST=172.16.1.1  # VM1 IP via VM3 router
      - NARRATOR_PORT=5000
    networks:
      - garou-network
    restart: unless-stopped

networks:
  garou-network:
    driver: bridge
