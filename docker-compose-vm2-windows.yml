version: '3.8'

# Docker Compose pour Windows (BONUS)
# Contient l'IA d'analyse
# Windows VM IP: 172.16.2.1/24, Gateway: 172.16.2.254 (VM3)
# VM1 accessible via: 172.16.1.1 (routed through VM3)

services:
  decision_ai:
    image: localhost:443/garou-decision-ai:latest
    container_name: garou-decision-ai
    hostname: decision_ai
    environment:
      - PLAYER_ID=decision_ai
      - NARRATOR_HOST=172.16.1.1  # VM1 IP via VM3 router
      - NARRATOR_PORT=5000
    networks:
      - garou-network
    restart: unless-stopped

networks:
  garou-network:
    driver: bridge
